# ==========================================================
# 【何をする】GitHub Actions 無料枠の警告を院長のLINEワークスDMへ送る（この用途専用）
# 【いつ動く】cybozu-bot（公開・30分ごと）の見張りステップが「警告が要る」と判断したときだけ
#
# 【なぜ専用にして、汎用の通知部品にしないのか】
#   ワークフローの入力（inputs）は、実行ログの env 一覧にそのまま印字される。
#   このリポジトリは公開なので、汎用の「好きな文面を送る」入口をここに作ると、
#   患者氏名や金額を含む通知本文が誰でも読める場所に出てしまう
#   （2026-08-10に院長判断で lw_notify の公開化を却下済み。2026-08-31に実測でも確認）。
#   そこでこのワークフローは**数値と警戒レベルだけ**を受け取り、文面はここで組み立てる。
#   秘密（LW_PRIVATE_KEY等）はSecretsなのでログでは伏せ字になる。
#
# 【なぜ公開リポジトリでやるのか】
#   2026-08-30 14:30に無料枠を使い切って apotool（非公開）の自動化が丸1日止まったとき、
#   失敗通知Botも消費レポートも同じ非公開リポジトリの中にあったため完全に無音だった。
#   見張りと、その知らせ役は、止まる側と別の場所に置かないと一緒に黙る。
#   公開リポジトリのActionsは無料・無制限なので、枠が尽きても動く。
# ==========================================================
name: GitHub Actions 無料枠アラート

on:
  workflow_dispatch:
    inputs:
      level:
        description: '警戒レベル（warn=8割超え／blocked=使い切り）'
        required: true
        type: choice
        options:
          - warn
          - blocked
          - mismatch
      used:
        description: '当月の消費（分）'
        required: true
      forecast:
        description: '月末の着地見込み（分）'
        required: false
        default: '0'
      detail:
        description: '消費が多いリポジトリ名と分（例: apotool-automation 1774分／youtube-agent 79分）'
        required: false
        default: ''
      reset_month:
        description: '枠がリセットされる月（数字のみ）'
        required: false
        default: ''
      official:
        description: 'GitHubの正式な使用量（分）。-1＝読めなかった（mismatch のときだけ使う）'
        required: false
        default: ''

jobs:
  alert:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests "PyJWT[crypto]"

      - name: 院長DMへ送信
        env:
          LW_PRIVATE_KEY:   ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          LEVEL:        ${{ inputs.level }}
          USED:         ${{ inputs.used }}
          FORECAST:     ${{ inputs.forecast }}
          DETAIL:       ${{ inputs.detail }}
          RESET_MONTH:  ${{ inputs.reset_month }}
          OFFICIAL:     ${{ inputs.official }}
        run: |
          if [ "$LEVEL" = "blocked" ]; then
            export NOTIFY_BOT_ID=12789558   # 失敗通知Bot
            export NOTIFY_MESSAGE="【GitHub Actions 無料枠】🚨 使い切りました。非公開リポジトリの自動化が全部止まっています。
          当月の消費: ${USED}分 / 2000分
          内訳: ${DETAIL}
          止まっているもの: 非公開リポジトリのもの全部（apotool-automation・youtube-agent・payroll・ポータル更新ほか）
          動いているもの: 公開リポジトリのもの（サイボウズBot・期限アラート・GBP空き枠投稿・面談記録シートBot）は無料無制限で動き続けます
          復旧: ${RESET_MONTH}月1日に枠がリセットされれば自動で戻ります（UTC基準のため朝9時ごろ）。
          ▶ 対処: AIに「Actionsの無料枠が切れた」と伝えてください（消費の削り方まで対応します）"
          elif [ "$LEVEL" = "mismatch" ]; then
            # 2026-11-03〜 見張りの数え方が GitHub の正式な数字とずれた／正式な数字が読めなかった
            export NOTIFY_BOT_ID=12789558   # 失敗通知Bot
            if [ "$OFFICIAL" = "-1" ]; then
              export NOTIFY_MESSAGE="【GitHub Actions 無料枠】🔧 GitHubの正式な使用量が読めませんでした。
          見張りが数えた当月の消費: ${USED}分（こちらは読めています）
          正式な数字と見比べられないので、見張りの数え間違いに気づけない状態です。
          ▶ 対処: AIに「Actionsの使用量の鍵を見て」と伝えてください（鍵の期限切れの疑い）"
            else
              export NOTIFY_MESSAGE="【GitHub Actions 無料枠】🔧 見張りの数え方がGitHubの正式な数字とずれています。
          GitHubの正式な数字: ${OFFICIAL}分
          見張りが数えた数字: ${USED}分
          警告の判断は正式な数字で行っています。見張りの数え方が実態とずれた疑いがあります（11/3の誤警告と同じ型）。
          ▶ 対処: AIに「Actionsの見張りの数字がずれている」と伝えてください"
            fi
          else
            export NOTIFY_BOT_ID=12786828   # レポートBot
            export NOTIFY_MESSAGE="【GitHub Actions 無料枠】⚠️ 残りが少なくなっています。
          当月の消費: ${USED}分 / 2000分
          このペースの月末見込み: 約 ${FORECAST}分
          内訳: ${DETAIL}
          使い切ると非公開リポジトリの自動化が全部・無音で止まります（2026-08-30に実際に起きました）。
          ▶ 対処: AIに「Actionsの消費を減らして」と伝えてください"
          fi
          python lw_notify.py
