# ==========================================================
# 【何をする】暗号化ペイロードを復号して院長DMへ送る（患者名を含む通知の安全な迂回路）
# 【いつ動く】GitHub Actions課金ブロック中（2026-07-27〜31）に Claude Code が
#             ローカル手動実行の結果を通知するとき、workflow_dispatch で起動
# 【8月1日以降】無料枠リセットで不要になるので、このワークフローと secure_notify.py は削除する
# ==========================================================
name: 暗号化通知（課金ブロック中の臨時）

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Fernet暗号化済みメッセージ（base64）'
        required: true
        type: string
      bot_id:
        description: '送信元BotID（既定=完了通知Bot 12786833）'
        required: false
        default: '12786833'
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests "PyJWT[crypto]" cryptography
      - run: python secure_notify.py
        env:
          LW_PRIVATE_KEY: ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          NOTIFY_ENC_KEY: ${{ secrets.NOTIFY_ENC_KEY }}
          ENCRYPTED_PAYLOAD: ${{ inputs.payload }}
          NOTIFY_BOT_ID: ${{ inputs.bot_id }}
