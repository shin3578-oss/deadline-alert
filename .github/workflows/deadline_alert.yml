# ==========================================================
# 【何をする】やることリストの未完了を、担当者ごとに個別DMで聞く（進捗確認）。院長には前回の回答のまとめをDM
#            ※進捗確認モード(progress_mode)が off のあいだは従来どおり全員分を1通でチャンネルへ（2026-10-19〜切替中）
# 【いつ動く】週1回。原則 月曜 8:09（Cron-job.org「期限アラートBot」ジョブが起動）。
#            月曜が休診（祝日・お盆・年末年始・臨時休診）のときは配信せず、
#            その週の**最初の診療日**に繰り越して1回だけ送る。
#            繰り越し用の起動は月〜土 8:30 に apotool の spt_alert.yml のステップから来る
#            （2026-09-03に朝の起動ハブを廃止。月曜のCron-job.orgジョブもこの枠に振り替えたので、月曜も8:30）
#            （新しいcronは作らない。Cron-job.orgは12件で満杯のため）。
#            送るかどうかは main.py が公開の休診日カレンダーを見て自分で決めるので、
#            起動が重なっても二重送信にはならない。
# 【休診日判定】https://shin3578-oss.github.io/kds-dashboard/closed_days.json
#            （アポツールの rest-all を apotool-automation が毎日書き出したもの）
#            2026-08-12まではアポツールへ毎回ログインしていたが、公開カレンダーを
#            読むだけにしてブラウザ起動をやめた（実行時間 約1分短縮）。
# ==========================================================
name: やることリスト 期限アラート

on:
  workflow_dispatch:        # apotool の spt_alert.yml（月〜土8:30）から GitHub API 経由で起動
    inputs:
      alert_days:
        description: '何日以内をアラート対象にするか（省略時は7日）'
        required: false
        default: '7'
      dry_run:
        description: 'trueにするとLW送信せずログに出力のみ'
        required: false
        default: 'false'
      force_send:
        description: 'trueにすると「今週の最初の診療日だけ送る」の縛りを外して今すぐ送る（手動確認用）'
        required: false
        default: 'false'
      progress_mode:
        description: '進捗確認モード（off=従来の全員分1通／test=担当者別DMを院長だけに送る／live=担当者ごとにDMで聞く）。定期起動のときの既定は下の env で決まる'
        required: false
        default: 'off'

jobs:
  run-alert:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 必要パッケージをインストール
        run: pip install -r requirements.txt

      - name: 期限アラートを実行
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          LW_CLIENT_SECRET:        ${{ secrets.LW_CLIENT_SECRET }}
          LW_PRIVATE_KEY:          ${{ secrets.LW_PRIVATE_KEY }}
          LW_TARGET:               ${{ secrets.LW_TARGET }}
          LW_TARGET_TYPE:          ${{ secrets.LW_TARGET_TYPE }}
          ALERT_DAYS:              ${{ github.event.inputs.alert_days || '3' }}
          DRY_RUN:                 ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_SEND:              ${{ github.event.inputs.force_send || 'false' }}
          PROGRESS_MODE:           ${{ github.event.inputs.progress_mode || 'off' }}
        run: python main.py

      - name: 失敗をLINEワークスに通知
        if: failure()
        env:
          LW_PRIVATE_KEY:   ${{ secrets.LW_PRIVATE_KEY }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          NOTIFY_MESSAGE:   "❌ 期限アラートBot 失敗 — 今週の未完了タスク通知が出ていない可能性があります。GitHub Actions のログを確認してください"
          NOTIFY_BOT_ID: "12789558"  # 失敗通知Bot
        run: |
          pip install requests "PyJWT[crypto]"
          python lw_notify.py
